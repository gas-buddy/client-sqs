name: Node CI

on:
  push:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - run: yarn install --immutable
    - run: yarn build
    - run: yarn lint
    - run: yarn test
